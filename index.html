<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spin & Win</title>
  <link rel="preload" href="assets/wheel.png" as="image">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <img class="poster" src="assets/zootopia.png" alt="Poster" />
    <div class="game">
      <div class="brand">Cool-Vita®</div>
      <h1 class="title"><span>SPIN &amp; WIN</span><br/>DISNEYLAND TICKET</h1>
      <p class="subtitle">1000 Points Spin Once, 100% Get the Prize</p>

      <div class="wheel-wrap">
        <img class="wheel" id="wheel" src="assets/wheel.png" alt="wheel" />
        <img class="arrow center" src="assets/arrow.png" alt="arrow" />
      </div>

      <button id="spinBtn" class="spin">
        <img src="assets/spin-btn.png" alt="SPIN" />
      </button>

      <div class="result" id="result">Tekan SPIN untuk mulai</div>
    </div>
    <img class="bg" src="assets/bg.png" alt="" />
  </div>

  <script src="script.js"></script>
</body>
</html>
